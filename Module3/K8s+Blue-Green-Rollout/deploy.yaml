apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: rollout
spec:
  revisionHistoryLimit: 100

  replicas: 3

  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"