apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: bg-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: example-app
      env: blue
  template:
    metadata:
      labels:
        app: example-app
        env: blue
    spec:
      containers:
      - name: app
        image: demoapp:v1.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"