services:
  database:
    container_name: database
    build:
      context:      ./containers/database
    restart:        always
    networks:       [webapp-network]
    env_file:       ./containers/database/src/.env
  service:
    container_name: service
    build:
      context:      ./containers/service
    restart:        always
    ports:          [8080:80]
    networks:       [webapp-network]
    depends_on:     [database]
    env_file:       ./containers/service/src/.env


################################################################################
# NETWORK CONFIGURATION
################################################################################

networks:
  webapp-network:
    driver: bridge  # Internal network for service communication